name: uber_final
description: "A new Flutter project."
publish_to: 'none'  # Keeps the package private

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Uncomment or add dependencies as required for your project:
  # google_maps_flutter: ^2.9.0
  # If you decide to use a fixed version of flutter_credit_card or a different package:
  flutter_credit_card: ^4.0.1 # Example version, ensure this is a compatible version!

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/drivers/
    - assets/cars/
    - assets/images/
